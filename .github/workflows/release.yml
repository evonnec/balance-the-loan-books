name: Release

# Tags are vMAJOR.MINOR.PATCH, optionally with a PEP 440 pre-release suffix written the way
# uv normalizes it: v1.2.0a1, v1.2.0b1, v1.2.0rc1 (not v1.2.0-rc.1). The tag must equal
# "v" + the version in pyproject.toml. Pre-releases become GitHub pre-releases.
# This is the only workflow that publishes (GitHub Release and, opt-in, PyPI).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test, build and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Release builds start clean.
          enable-cache: false
      - name: Check tag is semver and matches project version
        id: version
        run: |
          version=$(uv version --short)
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[aN|bN|rcN]"
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Build
        run: uv build --no-sources
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE

  # Opt-in. One-time setup is in docs/RELEASING.md. Publishes the exact files built above.
  publish-pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/balance-the-loan-books/
    permissions:
      id-token: write # OIDC token for trusted publishing; no API token is stored
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # --check-url skips files already on PyPI, so a re-run after a partial upload succeeds.
      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
